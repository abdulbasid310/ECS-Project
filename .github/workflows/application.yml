name: CI/CD pipeline

on:
  push:
    branches:
      - main
    paths:
      - "gatus/**"

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: gatus-repo
  ECS_CLUSTER: gatus_cluster
  ECS_SERVICE: gatus_service

permissions:
  id-token: write
  contents: read

jobs: 
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::060501087561:role/GitHubActionsRole
        aws-region: eu-west-2

    - name: Set up Docker buildx
      uses: docker/setup-buildx-action@v3
    
    - name: log in to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      id: build-image
      run: |
        IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        docker build -t $IMAGE_URI ./gatus 
        echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

    - name: Run trivy security scan
      uses: aquasecurity/trivy-action@v0.36.0
      with: 
        image-ref: ${{ env.IMAGE_URI }}
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH,MEDIUM'

    - name: Push Docker image
      run: |
        docker push ${{ steps.build-image.outputs.image }}

    - name: Download task definition
      run: |
        aws ecs describe-task-definition \
        --task-definition gatus_definition \
        --query taskDefinition \
        --region eu-west-2 > task-definition.json

    - name: Render task definition
      id: render-task-definition
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: gatus_container
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy to ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}


    